[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-media-provider-soundcloud"
dynamic = ["version"]
description = "OVOS MediaProvider plugin for SoundCloud (replaces ovos-skill-soundcloud)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAI", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.10"
keywords = ["ovos", "OpenVoiceOS", "OCP", "media", "soundcloud", "MediaProvider"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mediavocab>=1.0.0",
    "ovos-plugin-manager>=2.1",
    "nuvem_de_som>=0.3.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-media-provider-soundcloud"
Source = "https://github.com/OpenVoiceOS/ovos-media-provider-soundcloud"

[project.entry-points."opm.media.provider"]
soundcloud = "ovos_media_provider_soundcloud:SoundcloudMediaProvider"

[tool.setuptools]
packages = ["ovos_media_provider_soundcloud"]

[tool.setuptools.dynamic]
version = { attr = "ovos_media_provider_soundcloud.version.__version__" }
